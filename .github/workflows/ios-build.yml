name: iOS-ipa-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.9.2'   # pin this — 'stable' silently changes over time
          architecture: x64
          cache: true

      - run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - run: pod repo update
        working-directory: ios

      - run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: build/ios/iphoneos
        run: |
          mkdir Payload
          mv Runner.app Payload
          zip -qq -r -9 ${{ github.event.repository.name }}.ipa Payload

      - name: Set release tag
        id: vars
        run: echo "tag=build-$(date +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/${{ github.event.repository.name }}.ipa
          tag: ${{ steps.vars.outputs.tag }}
          overwrite: true
          body: "Automated build from commit ${{ github.sha }}"